<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ケロッと！はらぺこエコガエル</title>

<style>

*{
    box-sizing:border-box;
}

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
    "Arial Rounded MT Bold",
    "Hiragino Maru Gothic Pro",
    sans-serif;

    background:#d9f7d9;

}


#app{

    height:100dvh;

    display:flex;

    flex-direction:column;

}


/* メイン */

.main{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    overflow:hidden;

}


/* ページ */

.page{

    display:none;

    width:100%;

    height:100%;

    flex-direction:column;

    align-items:center;

    justify-content:space-evenly;

    text-align:center;

    overflow:hidden;

}


.active{

    display:flex;

}



/* タイトル */

h1{

    font-size:32px;

    color:#38a852;

}


h2{

    font-size:45px;

    color:#2e7d32;

}



.home-frog{

    width:150px;

    height:150px;

    display:flex;

    justify-content:center;

    align-items:center;

}


.home-frog img{

    width:120%;

    height:120%;

    object-fit:contain;

}



/* ゴミ数 */

.number{

    font-size:110px;

    font-weight:bold;

    color:#38a852;

}


.unit{

    font-size:40px;

}


.count-area{

    display:flex;

    align-items:baseline;

    gap:10px;

}



/* 共通カエル */

.frog{

    width:150px;

    height:150px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    margin:0 auto;

    font-size:120px;

}



/* 満腹度 */

.gauge{

    width:85%;

    height:40px;

    background:#ddd;

    border-radius:30px;

    overflow:hidden;

}


.gauge-inner{

    height:100%;

    width:0%;

    background:#7bdc4c;

    transition:0.5s;

}
.stack-gauge{

    width:100px;
    height:300px;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;

    display:flex;

    flex-direction:column-reverse;

}


.stack{

    height:100%;

    overflow:hidden;

    white-space:nowrap;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:16px;

    font-weight:bold;

    transition:0.5s;

}
.stack span{
    margin-left:5px;
}

.pet{

    background:#29B6F6;
    color:white;

}


.burn{

    background:#F44336;
    color:white;

}


.can{

    background:#FFD600;
    color:black;

}


.status-text{

    font-size:30px;

}


.level{

    font-size:35px;

}



/* 画像サイズ */

h2 img{

    width:100px;

    height:100px;

    object-fit:contain;

}



/* ナビ */

.nav{

    height:100px;

    background:white;

    display:flex;

    border-top:2px solid #b7eeb7;

}


.nav button{

    flex:1;

    border:none;

    background:white;

    color:#2e7d32;

    font-size:22px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}


.nav button.active-tab{

    background:#b7eeb7;

    font-weight:bold;

}


</style>

</head>


<body>


<div id="app">


<div class="main">



<!-- ホーム -->

<div id="home" class="page active">


<h1>
🐸 ホーム
</h1>


<div class="home-frog">

<img src="images/frog.png">

</div>


<div class="level">

レベル：
<span id="level">
1
</span>

</div>
<div class="stack-gauge">

    <div id="homePetGauge" class="stack pet">
        🧴<span id="homePetText">0%</span>
    </div>

    <div id="homeBurnGauge" class="stack burn">
        🔥<span id="homeBurnText">0%</span>
    </div>

    <div id="homeCanGauge" class="stack can">
        🥫<span id="homeCanText">0%</span>
    </div>

</div>





<!-- 缶 -->

<div id="canPage" class="page">


<h2>

<img src="images/kann2.png">

</h2>


<div class="count-area">


<div class="number" id="can">
0
</div>


<div class="unit">
個
</div>


</div>


</div>






<!-- 燃えるゴミ -->

<div id="bottlePage" class="page">


<h2>

<img src="images/moerugomi2.png">

</h2>


<div class="count-area">


<div class="number" id="burnable">
0
</div>


<div class="unit">
個
</div>


</div>


</div>






<!-- ペットボトル -->

<div id="petPage" class="page">


<h2>

<img src="images/pettobotoru2.png">

</h2>


<div class="count-area">


<div class="number" id="petbottle">
0
</div>


<div class="unit">
個
</div>


</div>


</div>



</div>





<!-- 共通部分 -->

<div class="common-status">


<div class="frog">

🐸







<!-- ナビ -->

<div class="nav">


<button onclick="changePage('home',this)"
class="active-tab">

🏠
<br>
ホーム

</button>


<button onclick="changePage('canPage',this)">

🥫
<br>
缶

</button>


<button onclick="changePage('bottlePage',this)">

🔥
<br>
燃える

</button>


<button onclick="changePage('petPage',this)">

🧴
<br>
ペット

</button>


</div>


</div>
<script>


const API_URL =
"http://172.20.124.38:5000/api/status";




// ページ切替

function changePage(id,button){


document.querySelectorAll(".page")
.forEach(page=>{

    page.classList.remove("active");

});


document.getElementById(id)
.classList.add("active");



document.querySelectorAll(".nav button")
.forEach(btn=>{

    btn.classList.remove("active-tab");

});


button.classList.add("active-tab");


}






// 画面更新

function updateScreen(data){

function setGauge(id, value, color){

    document.getElementById(id).style.width = value + "%";
    document.getElementById(id).style.backgroundColor = color;

}


document.getElementById("can")
.innerHTML =
data.counts.can;



document.getElementById("burnable")
.innerHTML =
data.counts.burnable;



document.getElementById("petbottle")
.innerHTML =
data.counts.petbottle;





// 各ゴミの満腹度
let canHunger = Math.min(data.counts.can * 10, 100);
let burnableHunger = Math.min(data.counts.burnable * 10, 100);
let petHunger = Math.min(data.counts.petbottle * 10, 100);

// ホーム表示用の割合計算
let total =
    data.counts.can +
    data.counts.burnable +
    data.counts.petbottle;


// 0個の場合
if(total == 0){
    total = 1;
}


// 100%中の割合
let canPercent =
    Math.round((data.counts.can / total) * 100);


let burnPercent =
    Math.round((data.counts.burnable / total) * 100);


let petPercent =
    100 - canPercent - burnPercent;



// 数字表示
document.getElementById("homeCanText").innerHTML =
canPercent + "%";

document.getElementById("homeBurnText").innerHTML =
burnPercent + "%";

document.getElementById("homePetText").innerHTML =
petPercent + "%";

// 縦型積み上げグラフの高さ変更

document.getElementById("homeCanGauge").style.height =
canPercent + "%";

document.getElementById("homeBurnGauge").style.height =
burnPercent + "%";

document.getElementById("homePetGauge").style.height =
petPercent + "%";

// ホームは合計
let homeHunger = Math.min(
    canHunger +
    burnableHunger +
    petHunger,
    100
);



// 缶（黄色）
document.getElementById("canHunger").innerHTML = canHunger;
setGauge("canGauge", canHunger, "#FFD600");

// 燃えるゴミ（赤）
document.getElementById("burnableHunger").innerHTML = burnableHunger;
setGauge("burnableGauge", burnableHunger, "#F44336");

// ペットボトル（水色）
document.getElementById("petHunger").innerHTML = petHunger;
setGauge("petGauge", petHunger, "#29B6F6");





document.getElementById("level")
.innerHTML =
data.level;



}






// ダミーデータ

function getDummyData(){


return{


counts:{


can:5,


burnable:3,


petbottle:8


},


level:2



};


}







// Flask取得

async function getStatus(){


try{


const response =

await fetch(API_URL);



if(!response.ok){

    throw Error();

}



const data =

await response.json();



updateScreen(data);



}

catch(error){


console.log(

"Flask未接続 → ダミー表示"

);



updateScreen(

getDummyData()

);



}


}






getStatus();



setInterval(

getStatus,

300

);



</script>


</body>

</html>
