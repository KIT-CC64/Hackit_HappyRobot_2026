<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ケロッと！はらぺこエコガエル</title>

<style>

*{
    box-sizing:border-box;
}

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
    "Arial Rounded MT Bold",
    "Hiragino Maru Gothic Pro",
    sans-serif;

    background:#d9f7d9;

}


#app{

    height:100dvh;

    display:flex;

    flex-direction:column;

}


/* メイン */

.main{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    overflow:hidden;

}


/* ページ */

.page{

    display:none;

    width:100%;

    height:100%;

    flex-direction:column;

    align-items:center;

    justify-content:space-evenly;

    text-align:center;

    overflow:hidden;

}


.active{

    display:flex;

}



/* タイトル */

h1{

    font-size:32px;

    color:#38a852;

}


h2{

    font-size:45px;

    color:#2e7d32;

}



.home-frog{

    width:150px;

    height:150px;

    display:flex;

    justify-content:center;

    align-items:center;

}


.home-frog img{

    width:120%;

    height:120%;

    object-fit:contain;

}



/* ゴミ数 */

.number{

    font-size:110px;

    font-weight:bold;

    color:#38a852;

}


.unit{

    font-size:40px;

}


.count-area{

    display:flex;

    align-items:baseline;

    gap:10px;

}



/* 共通カエル */

.frog{

    width:150px;

    height:150px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    margin:0 auto;

    font-size:120px;

}



/* 満腹度 */

.gauge{

    width:85%;

    height:40px;

    background:#ddd;

    border-radius:30px;

    overflow:hidden;

}


.gauge-inner{

    height:100%;

    width:0%;

    background:#7bdc4c;

    transition:0.5s;

}


.status-text{

    font-size:30px;

}


.level{

    font-size:35px;

}



/* 画像サイズ */

h2 img{

    width:100px;

    height:100px;

    object-fit:contain;

}



/* ナビ */

.nav{

    height:100px;

    background:white;

    display:flex;

    border-top:2px solid #b7eeb7;

}


.nav button{

    flex:1;

    border:none;

    background:white;

    color:#2e7d32;

    font-size:22px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}


.nav button.active-tab{

    background:#b7eeb7;

    font-weight:bold;

}


</style>

</head>


<body>


<div id="app">


<div class="main">



<!-- ホーム -->

<div id="home" class="page active">


<h1>
🐸 ホーム
</h1>


<div class="home-frog">

<img src="images/frog.png">

</div>


<div class="level">

レベル：
<span id="level">
1
</span>

</div>


</div>





<!-- 缶 -->

<div id="canPage" class="page">


<h2>

<img src="images/kann2.png">

</h2>


<div class="count-area">


<div class="number" id="can">
0
</div>


<div class="unit">
個
</div>


</div>


</div>






<!-- 燃えるゴミ -->

<div id="bottlePage" class="page">


<h2>

<img src="images/moerugomi2.png">

</h2>


<div class="count-area">


<div class="number" id="burnable">
0
</div>


<div class="unit">
個
</div>


</div>


</div>






<!-- ペットボトル -->

<div id="petPage" class="page">


<h2>

<img src="images/pettobotoru2.png">

</h2>


<div class="count-area">


<div class="number" id="petbottle">
0
</div>


<div class="unit">
個
</div>


</div>


</div>



</div>





<!-- 共通部分 -->

<div class="common-status">


<div class="frog">

🐸

</div>


<div class="gauge">

<div id="gauge" class="gauge-inner">

</div>

</div>


<div class="status-text">

満腹度：
<span id="hunger">
0
</span>
%

</div>


</div>





<!-- ナビ -->

<div class="nav">


<button onclick="changePage('home',this)"
class="active-tab">

🏠
<br>
ホーム

</button>


<button onclick="changePage('canPage',this)">

🥫
<br>
缶

</button>


<button onclick="changePage('bottlePage',this)">

🔥
<br>
燃える

</button>


<button onclick="changePage('petPage',this)">

🧴
<br>
ペット

</button>


</div>


</div>
<script>


const API_URL =
"http://172.20.124.38:5000/api/status";




// ページ切替

function changePage(id,button){


document.querySelectorAll(".page")
.forEach(page=>{

    page.classList.remove("active");

});


document.getElementById(id)
.classList.add("active");



document.querySelectorAll(".nav button")
.forEach(btn=>{

    btn.classList.remove("active-tab");

});


button.classList.add("active-tab");


}






// 画面更新

function updateScreen(data){



document.getElementById("can")
.innerHTML =
data.counts.can;



document.getElementById("burnable")
.innerHTML =
data.counts.burnable;



document.getElementById("petbottle")
.innerHTML =
data.counts.petbottle;





// ゴミ10個で満腹100%

let total =

data.counts.can +

data.counts.burnable +

data.counts.petbottle;



let hunger =

total * 10;



if(hunger > 100){

    hunger = 100;

}




document.getElementById("hunger")
.innerHTML =
hunger;



document.getElementById("gauge")
.style.width =
hunger + "%";





document.getElementById("level")
.innerHTML =
data.level;



}






// ダミーデータ

function getDummyData(){


return{


counts:{


can:5,


burnable:3,


petbottle:8


},


level:2



};


}







// Flask取得

async function getStatus(){


try{


const response =

await fetch(API_URL);



if(!response.ok){

    throw Error();

}



const data =

await response.json();



updateScreen(data);



}

catch(error){


console.log(

"Flask未接続 → ダミー表示"

);



updateScreen(

getDummyData()

);



}


}






getStatus();



setInterval(

getStatus,

300

);



</script>


</body>

</html>
